  - aesthetics_style
  - asset_first
  - asset_locking
  - character_design
  - full_production
  - performance_emotion
  execution_mode: on_demand
- id: asset-lock
  name: 资产版本锁定与分镜资产引用
  file: asset-lock.yaml
  description: 锁定人物、场景、道具的规范版本，建立依赖台账；仅在锁定资产后生成并引用分镜资产。
  priority: 85
  triggers:
  - 人物资产锁定
  - 角色资产锁定
  - 场景资产锁定
  - 资产冻结
  - 锁定人物和场景
  - 先锁定角色和场景
  - 分镜资产引用角色图
  - 分镜图引用场景图
  - 资产版本锁定
  - 先做人设和场景再分镜
  - 人物场景资产定稿后再分镜
  - 分镜图引用已锁定场景图
  - 分镜图引用已锁定人物图
  - 角色外观不要变化
  - 场景布局不要变化
  entrypoint: false
  always_run: false
  capabilities:
  - asset_locking
  - asset_first
  - character_design
  - spatial_continuity
  - quality_assurance
  execution_mode: on_demand
