- id: asset-first
  name: 资产前置管线
  file: asset-first.yaml
  description: 资产前置管线，由白话意图自动触发，可与其他能力模块叠加调度
  priority: 90
  triggers:
  - 资产前置
  - 角色资产板
  - 角色四视图
  - 角色设定图
  - 先做资产
  - 先做人物设定图和场景设定图
  - 先出角色图和场景图
  - 人物场景图后做分镜
  - 先出人物和场景图
  - 先做人物和场景图
  - 先设计人物和场景图
  - 资产包
