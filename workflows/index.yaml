version: 3.0.0
workflows:
- id: intent-analysis
  name: 白话意图解析与全量路由总入口
  file: intent-analysis.yaml
  description: 所有用户请求强制先进行语义解析、硬约束仲裁、能力闭包、资源检索和执行计划生成。
  priority: 1000
  triggers:
  - 任意用户请求
  - 帮我
  - 做一下
  - 写一下
  - 分析
  - 设计
  - 修改
  - 整理
  - 生成
  - 检查
  - 优化
  - 修复
  - 翻译
  - 解释
  - 转换
  - 规划
  entrypoint: true
  always_run: true
  capabilities:
  - action_choreography
  - aesthetics_style
  - api_integration
  - asset_first
  - asset_locking
  - audio_design
  - character_design
  - cinematography
  - external_skill_integration
  - full_production
  - general_orchestration
  - image_prompt
  - model_adaptation
  - novel_writing
  - output_formatting
  - performance_emotion
  - platform_adaptation
  - project_state_management
  - prompt_engineering
  - quality_assurance
  - reverse_engineering
  - safety_originality
  - screenwriting
  - short_video_content
  - skill_architecture_audit
  - spatial_continuity
  - storyboard
  - vfx_physics
  - video_prompt
