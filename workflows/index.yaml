  - action_choreography
  - aesthetics_style
  - asset_first
  - asset_locking
  - audio_design
  - character_design
  - cinematography
  - full_production
  - general_orchestration
  - model_adaptation
  - novel_writing
  - performance_emotion
  - prompt_engineering
  - quality_assurance
  - safety_originality
  - screenwriting
  - short_video_content
  - spatial_continuity
  - storyboard
  - vfx_physics
  - video_prompt
  execution_mode: on_demand
