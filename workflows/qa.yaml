# 质量审查工作流
# 审查已有内容，输出问题清单

name: qa
version: "3.0.0"
description: 全面质量审查

stages:
  - id: Q0
    name: 输入识别
    inputs: 待审查内容（分镜表/提示词/剧本/角色卡等）
    outputs: 内容类型判断
    modules:
      - 13-quality-gates

  - id: Q1
    name: 多维度机检（并行）
    inputs: 待审查内容
    outputs: 各维度问题清单
    modules:
      - 13-quality-gates（QG0~QG8全维度）
      - 04-spatial-continuity（空间穿帮检查）
      - 07-prompt-engineering（提示词质量检查）
      - 05-character-performance（表演合理性）
    parallel: true

  - id: Q2
    name: 归因与修复建议
    inputs: 问题清单
    outputs: 归因报告 + 具体修复建议
    modules:
      - 13-quality-gates（失败归因树）

final_outputs:
  - 质量审查报告
  - 问题清单（按严重程度排序）
  - 归因分析
  - 具体修复建议
