# 反推工程工作流 (Reverse Engineering)
# 上传参考图/片，反推完整参数模板

name: reverse-engineering
version: "3.0.0"
description: 从参考素材反推完整视觉参数，建立可复刻模板

stages:
  - id: R0
    name: 素材接收与初步判断
    inputs: 用户上传的参考图/参考片
    outputs: 素材类型判断（图/视频）、主体识别
    modules:
      - 09-reverse-engineering（模块0：反推总览）
    gates: []

  - id: R1
    name: 镜头参数反推
    inputs: 参考素材
    outputs: 镜头锁定总句、摄影参数清单
    modules:
      - 09-reverse-engineering（模块2：相机镜头参数）
      - 03-cinematography（辅助验证）
    priority: highest  # 镜头锁定最高优先级

  - id: R2
    name: 视觉元素拆解（并行）
    inputs: 参考素材
    outputs: 构图、人物、服装、物体、材质、光线、环境、风格、后期
    modules:
      - 09-reverse-engineering（模块1~13，除模块2外）
    parallel: true  # 所有模块并行分析

  - id: R3
    name: 视频运动反推（如为视频）
    inputs: 参考视频
    outputs: 镜头运动、时间节奏、动作分解
    modules:
      - 09-reverse-engineering（模块14：视频镜头运动）
    conditional: true

  - id: R4
    name: 模板编译与输出
    inputs: 所有反推结果
    outputs:
      - 完整复刻提示词
      - 同风格新图模板（锁定项+可替换项）
      - 负向词与防跑偏约束
      - 可调参数表
    modules:
      - 07-prompt-engineering（提示词编译）
      - 08-model-adapters（多平台适配输出）

  - id: R5
    name: 质量校验
    inputs: 反推结果
    outputs: 置信度报告、不确定项清单
    modules:
      - 13-quality-gates（反推专项检查）

final_outputs:
  - 反推总览与置信度报告
  - 完整复刻提示词（全平台兼容版）
  - 同风格新图模板
  - 负向词与防跑偏约束
  - 可调参数表
