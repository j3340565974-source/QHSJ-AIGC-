# 短视频平台内容工作流（Short-form Content）
name: platform-short-video
version: "3.0.0"
description: 从受众与平台目标到短视频脚本、镜头节奏、声音和发布包装
triggers: [短视频平台方案, 平台短视频脚本, 抖音短剧, 小红书视频文案, 视频号脚本]
stages:
  - id: SV0
    name: 平台和受众约束
    inputs: 用户目标、目标平台、受众、时长
    outputs: 内容目标、平台硬限制、需核实的时效性假设
    modules: [references/platform-algorithm-evidence.md, references/platform-playbooks.md]
  - id: SV1
    name: 钩子与叙事脚本
    inputs: 内容目标和用户创意
    outputs: 开场钩子、冲突节拍、完整脚本
    modules: [references/hook-library.md, references/platform-script-patterns-180.md, references/03-short-video.md]
    depends_on: [SV0]
  - id: SV2
    name: 视觉节奏与声音设计（并行）
    inputs: 脚本和目标时长
    outputs: 镜头分配、屏幕动作、对白/环境音节拍
    modules: [references/08-storyboard-directing.md, references/03-cinematography.md, references/13-audio-sound.md]
    parallel: true
    depends_on: [SV1]
  - id: SV3
    name: 平台交付包装与质检
    inputs: 脚本、视觉节奏、声音节拍
    outputs: 发布文案、标题候选、交付格式和风险清单
    modules: [references/platform-playbooks.md, references/13-quality-gates.md, references/15-safety-compliance.md]
    depends_on: [SV2]
final_outputs: [短视频脚本, 分镜/时长分配, 声音建议, 平台包装建议, 质量与合规清单]
