# 白话意图解析与全量路由总入口（Intent Analysis & Universal Router）
name: intent-analysis
version: "3.0.0"
description: 所有用户请求的强制前置工作流，解析真实目标、交付物、隐含依赖、约束和排除项，再把任务映射到全部必要能力/工作流/知识资源。
triggers: [任意用户请求, 帮我, 做一下, 写一下, 分析, 设计, 修改, 整理, 生成, 检查, 优化, 修复, 翻译, 解释, 转换, 规划]
entrypoint: true
always_run: true
stages:
  - id: I0
    name: 原话语义解析
    inputs: 用户原始请求、当前对话上下文、可用附件和项目状态
    outputs: 用户目标、目标对象、源材料、交付物、受众/平台、时长/数量/格式、风格偏好、质量门槛、禁止项、隐含依赖、未决信息
    rules:
      - 不将关键词命中等同于理解意图，先按整句语义识别请求动作和目标对象
      - 把并列、递进、条件、否定、比较、例外和范围限定分别解析，不用一个否定词误伤整句其他目标
      - 保留用户明确约束与原始事实；不得静默删减、不擅自补造事实
      - 当前对话或附件已有答案时不得重复追问
  - id: I1
    name: 交付物和能力集合推断
    inputs: I0解析结果
    outputs: 主任务、次任务、全部交付物、直接能力集合、候选能力集合、置信度和证据
    rules:
      - 一句话多个交付物必须拆成多个子任务并叠加路由
      - 将明确的专业术语、中文白话、同义表达、语境代称共同作为证据
      - 术语不明确但上下文足够时优先用上下文推断；仅在关键分歧改变交付结果时才提出一个聚焦问题
      - 未识别新表达时不得丢弃请求，必须进入总控兜底并检索能力/章节索引
      - 用户表达“百分百全路由、所有板块都接上、每个模块都能调用、全面理解用户要求、不能漏项”等闭包目标时，即使未出现“Skill/代码/审计”字样，也必须触发 skill_architecture_audit 与 quality_assurance，并检查资源图闭包和回归测试
      - 先按语义拆分用户提出的全部子任务，再逐项匹配能力/工作流/资源；不得以仅命中 intent-analysis 或 general_orchestration 作为复杂任务的最终路由结果
      - 用户涉及人物、场景、道具资产或分镜图时，必须检查资产前置依赖：先确立规格和唯一ID，生成角色/场景资产，核验并锁定版本，再建立空间账本；只有在此之后才可生成分镜资产并显式引用锁定资产
      - 空间变量需区分坐标、相对距离、身体朝向、头部朝向、眼睛注视目标、人物状态、道具状态、摄影机位置/轨迹；缺少尺寸时标记估算，不能编造精确数值
      - 若用户要求全量路由整改，区分“资源全部可路由”与“每个任务都调用全部资源”：保证全量可达，但实际执行只调用与任务相关、依赖必需且未被硬约束排除的模块
  - id: I2
    name: 约束冲突与否定范围仲裁
    inputs: 交付物、全部原始约束
    outputs: 硬约束列表、否定范围、兼容组合、冲突项、优先级
    rules:
      - 仲裁优先级：安全边界 > 用户明确硬约束/禁止项 > 来源事实与项目Canon > 逻辑/物理/空间连续性 > 交付和平台格式 > 叙事及表演目标 > 风格偏好 > 可选装饰
      - “不要X”只排除其语义作用范围，不得误删同句其他任务；“不要新增X”不等于禁止分析X
      - “只要X”启用单交付模式；明确“全流程/全链路/从创意到成片”时才启用完整生产管线
  - id: I3
    name: 路由图闭包与模块检索
    inputs: 已仲裁意图和能力集合、routing/route-graph.json、routing/route-registry.json
    outputs: 直接能力、递归依赖能力、自动工作流、条件工作流、规范知识模块、别名跳转、章节候选、待加载资源清单
    rules:
      - 对直接命中能力进行递归依赖闭包，检测循环并对已访问节点去重
      - 区分“审计可达性”与“执行交付”：全量审计将全部资源纳入审计候选，但不能因此执行无关的创作交付工作流
      - 一次扫描所有用户子任务，汇总能力后统一去重；不得一命中模块就停止
      - 每个选中能力必须有至少一个可调度工作流；每个资源经标签边/别名边可追溯到能力和工作流
      - 先读取主任务核心模块、工作流输入输出契约和必要Schema，再按内容缺口逐步展开辅助模块
      - 由架构审计触发的传递性依赖只用于审计依赖/连通证据，不自动触发与本次交付无关的视觉创作工作流
      - 已路由但本轮无需读取的资源必须留在候选/延迟加载清单，不得从路由图中删除
  - id: I4
    name: 依赖调度和并行计划
    inputs: 工作流、各阶段依赖、数据产物、用户硬约束
    outputs: 分阶段执行计划、并行组、串行依赖、数据传递、质量门禁、回退路径
    rules:
      - 无共享写入和数据依赖的子任务可并行；依赖前序产物或共享状态的任务必须串行
      - 同一资源只加载一次；重复模块合并，不重复生成相互冲突的版本
      - 工作流和能力路由无固定前五名/固定数量上限；呈现层限制只能分批展示，不得造成执行路径截断
      - 对复杂审计使用多角色/多智能体分工：需求、架构、领域、空间、红队和回归测试并行审查；只有宿主实际支持并启动子代理时才报告多智能体已运行
  - id: I5
    name: 执行与自适应补路由
    inputs: 已确认执行计划、所需资源和当前工具权限
    outputs: 用户请求的交付物、阶段产物、执行状态、失败记录和待办事项
    rules:
      - 在宿主环境中实际读取所选资源并执行对应规则，不得只展示路由计划便声称任务已完成
      - 执行中发现缺少领域、约束或数据时，返回I1/I3追加路由，并保留原始任务和已完成产物
      - 无工具/外部API权限时，明确输出可完成部分和阻塞原因，不虚报调用成功
  - id: I6
    name: 总体验收与未覆盖检查
    inputs: 全部交付物、用户原始目标与约束、路由覆盖清单
    outputs: 逐项验收矩阵、修复结果、未完成项及原因
    rules:
      - 逐句回看用户要求，逐项核验目标、内容、格式、数量、排除项和交付文件
      - 检查是否存在没有能力节点、工作流、资源或测试映射的子任务
      - 检查角色/场景资产是否在分镜资产之前核验锁定，且每镜是否引用正确版本的规范资产
      - 检查多智能体/多角色审查结论是否有证据、是否冲突、是否对应回归用例
      - 未达标则按错误归因回到对应阶段修复，修复后复测，不以删内容制造通过
final_outputs: [意图结构化记录, 全量路由计划, 分阶段执行计划, 交付物清单, 验收矩阵]
