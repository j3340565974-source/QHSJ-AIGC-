name: Skill CI
on:
  push:
    branches: [main, refactor/full-restructure]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install jsonschema pyyaml
      - run: python3 scripts/check_package.py
      - run: python3 scripts/validate_schemas.py
      - run: python3 scripts/check_content.py
      - run: python3 scripts/run_evals.py
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: hashFiles('backend/tests/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: pytest -q backend/tests
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: hashFiles('frontend/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build && npm test
